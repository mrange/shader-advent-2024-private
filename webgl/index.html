<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>How to Render ShaderToy Shaders with HTML and WebGL</title>
</head>
<body>
    <div class="canvas-container">
      <canvas id="webGLCanvas" width="800" height="600"></canvas>
      <div class="caption">
        <h2>Shader by the talented <a target="_blank" href="https://www.shadertoy.com/user/kishimisu">kishimisu</a></h2>
        <p>This example demonstrates how to render a ShaderToy shader in HTML using WebGL.</p>
        <p>The sample is designed to be simple, clear, and self-contained.</p>
      </div>
    </div>
    <script>
      const vertexShaderSource = `#version 300 es
          precision highp float;

          // The vertex shader is about as simple as it can get.
          //  Pass the input untransformed to gl_Position
          in vec4 position;
          void main() {
            gl_Position = position;
          }
      `;

      const fragmentShaderSource = `#version 300 es
          precision highp float;

          out vec4 fragColor;

          // Support ShaderToy iTime and iResolution
          //  ShaderToy has many more uniforms but these two
          //  are the most common ones

          uniform float iTime;
          uniform vec3 iResolution;

          // Support ShaderToy mainImage signature
          void mainImage(out vec4 fragColor, in vec2 fragCoord);

          void main() {
            vec4 fc;
            mainImage(fc, gl_FragCoord.xy);
            fragColor = fc;
          }

          // Paste ShaderToy shader here -->
          //  Shader source found at: https://www.shadertoy.com/view/mtyGWy

          /* This animation is the material of my first youtube tutorial about creative
            coding, which is a video in which I try to introduce programmers to GLSL
            and to the wonderful world of shaders, while also trying to share my recent
            passion for this community.
                                                Video URL: https://youtu.be/f4s1h2YETNY
          */

          //https://iquilezles.org/articles/palettes/
          vec3 palette( float t ) {
              vec3 a = vec3(0.5, 0.5, 0.5);
              vec3 b = vec3(0.5, 0.5, 0.5);
              vec3 c = vec3(1.0, 1.0, 1.0);
              vec3 d = vec3(0.263,0.416,0.557);

              return a + b*cos( 6.28318*(c*t+d) );
          }

          //https://www.shadertoy.com/view/mtyGWy
          void mainImage( out vec4 fragColor, in vec2 fragCoord ) {
              vec2 uv = (fragCoord * 2.0 - iResolution.xy) / iResolution.y;
              vec2 uv0 = uv;
              vec3 finalColor = vec3(0.0);

              for (float i = 0.0; i < 4.0; i++) {
                  uv = fract(uv * 1.5) - 0.5;

                  float d = length(uv) * exp(-length(uv0));

                  vec3 col = palette(length(uv0) + i*.4 + iTime*.4);

                  d = sin(d*8. + iTime)/8.;
                  d = abs(d);

                  d = pow(0.01 / d, 1.2);

                  finalColor += col * d;
              }

              fragColor = vec4(finalColor, 1.0);
          }
      `;

      const canvas = document.getElementById('webGLCanvas');
      const gl = canvas.getContext('webgl2');

      if (!gl) {
        alert("No WebGL2 content, can't continue");
      } else {
        function createShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
          }
          return shader;
        }

        function createProgram(vertexSource, fragmentSource) {
          const vertexShader = createShader(gl.VERTEX_SHADER, vertexSource);
          const fragmentShader = createShader(gl.FRAGMENT_SHADER, fragmentSource);

          if (!vertexShader || !fragmentShader) {
              return null;
          }

          const program = gl.createProgram();
          gl.attachShader(program, vertexShader);
          gl.attachShader(program, fragmentShader);
          gl.linkProgram(program);

          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
              console.error('Program linking error:', gl.getProgramInfoLog(program));
              gl.deleteProgram(program);
              gl.deleteShader(vertexShader);
              gl.deleteShader(fragmentShader);
              return null;
          }

          // Clean up individual shaders (they're now linked into the program)
          gl.deleteShader(vertexShader);
          gl.deleteShader(fragmentShader);

          return program;
        }

        const shaderProgram = createProgram(vertexShaderSource, fragmentShaderSource);
        gl.useProgram(shaderProgram);

        // Create quad vertices (as a triangle strip)
        const vertices = new Float32Array([
            -1, -1,  // Bottom left
             1, -1,  // Bottom right
            -1,  1,  // Top left
             1,  1,  // Top right
        ]);

        // Create and bind vertex buffer
        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        // Get and enable position attribute
        const positionLocation = gl.getAttribLocation(shaderProgram, 'position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(
            positionLocation,  // Attribute location
            2,                // Number of components (x,y)
            gl.FLOAT,         // Data type
            false,            // Don't normalize
            0,                // Stride (0 = auto)
            0                 // Offset
        );

        const timeLocation = gl.getUniformLocation(shaderProgram, 'iTime');
        const resolutionLocation = gl.getUniformLocation(shaderProgram, 'iResolution');

        const begin = performance.now();

        function drawShader(now) {
          const currentTime = (now-begin)*0.001;
          const width = canvas.clientWidth;
          const height = canvas.clientHeight;
          gl.viewport(0, 0, width, height);

          gl.uniform1f(timeLocation, currentTime);
          gl.uniform3f(resolutionLocation, width, height, 1);

          gl.drawArrays(
              gl.TRIANGLE_STRIP,  // Drawing mode
              0,                  // Start vertex
              4                   // Number of vertices
          );

          requestAnimationFrame(drawShader);
        }

        requestAnimationFrame(drawShader);
      }
    </script>
</body>
</html>
